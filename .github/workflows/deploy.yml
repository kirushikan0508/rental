# ============================================================
# CD Pipeline — Vehicle Rental Marketplace
# ============================================================
# Deploys to staging on push to develop, production on push to main.
# Builds Docker images, pushes to registry, and deploys.
# ============================================================

name: Deploy

on:
  push:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: gateway
            context: backend/gateway
          - name: auth-service
            context: backend/services/auth-service
          - name: vehicle-service
            context: backend/services/vehicle-service
          - name: booking-service
            context: backend/services/booking-service
          - name: payment-service
            context: backend/services/payment-service
          - name: tracking-service
            context: backend/services/tracking-service
          - name: notification-service
            context: backend/services/notification-service
          - name: chat-service
            context: backend/services/chat-service
          - name: ai-service
            context: backend/services/ai-service
          - name: admin-service
            context: backend/services/admin-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: echo "TODO — Deploy to staging environment"

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: echo "TODO — Deploy to production environment"
